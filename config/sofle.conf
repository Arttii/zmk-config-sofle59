CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_BT_CTLR_PHY_2M=n 
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_KEYBOARD_NAME="SofleChoc"

CONFIG_ZMK_STUDIO=yes

CONFIG_ZMK_POINTING=y

# Linux BlueZ compatibility — prevents random disconnects with kernels that
# don't re-subscribe to notifications after reconnect.
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Debounce — reduce chatter / double key presses on choc switches.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=20
